<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SC-18 レポート出力 - EIAI TEC 事務管理システム</title>
<style>
:root{
  --color-bg:#f4f6f8;--color-surface:#ffffff;--color-border:#dde1e6;--color-text:#222831;
  --color-text-sub:#6b7280;--color-primary:#2c5f7c;--color-primary-dark:#1f4a61;
  --color-accent:#c0392b;--color-warn-bg:#fdecea;--color-soon:#b45309;--color-soon-bg:#fff4e0;--radius:6px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--color-bg);color:var(--color-text);font-size:14px;line-height:1.6;}
.app-header{background:var(--color-primary);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
.app-header .title{font-size:18px;font-weight:600;}
.app-header .back-link{color:#e6eef2;text-decoration:none;font-size:13px;}
.app-header .back-link:hover{text-decoration:underline;}
.container{max-width:1200px;margin:0 auto;padding:24px;}
h1.page-title{font-size:20px;margin:0 0 16px;}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
.toolbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
.filter-bar{display:flex;gap:12px;flex-wrap:wrap;}
.filter-bar .field{display:flex;flex-direction:column;gap:4px;}
.filter-bar label{font-size:12px;color:var(--color-text-sub);}
select,input[type=text],input[type=date],textarea{padding:7px 10px;border:1px solid var(--color-border);border-radius:4px;font-size:13px;font-family:inherit;background:#fff;}
select{min-width:160px;}
.btn{display:inline-block;padding:8px 16px;border-radius:4px;border:1px solid var(--color-border);background:#fff;color:var(--color-text);font-size:13px;cursor:pointer;text-decoration:none;font-family:inherit;}
.btn-primary{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}
.btn-primary:hover{background:var(--color-primary-dark);}
.btn-small{padding:4px 10px;font-size:12px;}
.btn-danger{color:var(--color-accent);border-color:var(--color-accent);}
.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--color-border);}
.tabs a{padding:8px 22px;text-decoration:none;color:var(--color-text-sub);font-size:14px;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px;}
.tabs a.active{color:var(--color-primary);border-bottom-color:var(--color-primary);}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px 12px;border-bottom:1px solid var(--color-border);text-align:left;font-size:13px;}
th{background:#eef1f4;color:var(--color-text-sub);font-weight:600;white-space:nowrap;}
td.amount{text-align:right;white-space:nowrap;}
tr.row-link{cursor:pointer;}
tr.row-link:hover{background:#f7f9fa;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap;}
.st-NS{background:#6b7280;}.st-IP{background:#1d4ed8;}.st-WR{background:#b45309;}.st-DN{background:#15803d;}
.badge-unpaid{background:#b91c1c;}.badge-partial{background:#b45309;}.badge-paid{background:#15803d;}
.badge-draft{background:#6b7280;}.badge-confirmed{background:#1d4ed8;}
.due-over{color:var(--color-accent);font-weight:700;}
.due-soon{color:var(--color-soon);font-weight:700;}
.tag{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:700;margin-left:6px;}
.tag-over{background:var(--color-accent);color:#fff;}
.tag-soon{background:var(--color-soon);color:#fff;}
.muted{color:var(--color-text-sub);}
.section-title{font-size:15px;font-weight:600;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--color-border);}
tr.overdue{background:var(--color-warn-bg);}tr.overdue td:first-child{border-left:3px solid var(--color-accent);}

.notice-ack{opacity:.55;}
.kind-tag{display:inline-block;padding:1px 8px;border-radius:3px;font-size:12px;background:#eef1f4;color:var(--color-text-sub);white-space:nowrap;}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;}
.switch .track{width:36px;height:20px;border-radius:10px;background:#c5cbd3;position:relative;display:inline-block;}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;}
.switch.on .track{background:var(--color-primary);}.switch.on .track::after{left:18px;}
.err-box{background:var(--color-soon-bg);border:1px solid #f0c98a;color:var(--color-soon);padding:8px 12px;border-radius:4px;font-size:13px;margin-bottom:14px;}
.note{background:#eef4f7;border-left:3px solid var(--color-primary);padding:8px 12px;font-size:12px;margin:0 0 14px;}
.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.form-row label{font-size:12px;color:var(--color-text-sub);}
.req{color:var(--color-accent);font-size:11px;margin-left:4px;}
.dialog{border:2px solid var(--color-primary);border-radius:var(--radius);background:#fff;padding:20px;max-width:560px;box-shadow:0 4px 14px rgba(0,0,0,.12);}
.dialog h2{font-size:16px;margin:0 0 14px;}
.dialog .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}
.field-err{color:var(--color-accent);font-size:12px;}
input[type=month]{padding:7px 10px;border:1px solid var(--color-border);border-radius:4px;font-size:13px;font-family:inherit;}
.type-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.type-item{border:1px solid var(--color-border);border-radius:4px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;}
.type-item.sel{border-color:var(--color-primary);background:#eef4f7;}
.type-item .n{font-weight:600;}.type-item .s{font-size:12px;color:var(--color-text-sub);}
.warn-text{color:var(--color-soon);font-size:12px;}
.result-ok{background:#e8f5ec;border:1px solid #b5dcc0;color:#15803d;padding:10px 14px;border-radius:4px;font-size:13px;}
</style>
</head>
<body>
<header class="app-header">
  <div class="title">事務管理システム</div>
  <a href="./SC-01_home.html" class="back-link">← ホームへ</a>
</header>
<div class="container">
  <h1 class="page-title">レポート出力</h1>
  <div class="card">
    <p class="note">CSV出力はバックアップの代わりにはなりません。</p>
    <p class="section-title">1. 出力する種類</p>
    <div class="type-list"><label class="type-item"><input type="radio" name="t"><span><span class="n">請求書一覧</span><br><span class="s">CSV / 期間の基準: 発行日</span></span></label><label class="type-item"><input type="radio" name="t"><span><span class="n">入金記録</span><br><span class="s">CSV / 期間の基準: 入金日</span></span></label><label class="type-item"><input type="radio" name="t"><span><span class="n">見積書一覧</span><br><span class="s">CSV / 期間の基準: 発行日</span></span></label><label class="type-item"><input type="radio" name="t"><span><span class="n">経費一覧</span><br><span class="s">CSV / 期間の基準: 発生日</span></span></label><label class="type-item sel"><input type="radio" name="t" checked><span><span class="n">月次損益集計レポート</span><br><span class="s">PDF または CSV / 期間の基準: 請求書の発行日・経費の発生日</span></span></label><label class="type-item"><input type="radio" name="t"><span><span class="n">案件別サマリー</span><br><span class="s">CSV / 期間の基準: 案件の納期または紐付き請求書の発行日</span></span></label><label class="type-item"><input type="radio" name="t"><span><span class="n">会計ソフト連携用エクスポート(汎用CSV)</span><br><span class="s">CSV / 期間の基準: 売上は発行日・経費は発生日</span></span></label></div>
    <p class="section-title" style="margin-top:22px">2. 対象期間</p>
    <div class="filter-bar">
      <div class="field"><label>開始年月</label><input type="month" value="2025-10"></div>
      <div class="field"><label>終了年月</label><input type="month" value="2026-09"></div>
      <div class="field"><label>出力形式(月次損益集計レポートのみ)</label><select><option>PDF</option><option selected>CSV</option></select></div>
    </div>
    <p class="muted" style="font-size:12px;margin:8px 0 0;">既定は現在月を含む直近12ヶ月です。出力形式は月次損益集計レポート選択時のみ表示され、他の種類はCSV固定です(この表示例は月次損益集計レポート選択時)。</p>
    <div class="field-err" style="margin-top:8px">(入力エラー例)開始年月は終了年月以前を指定してください</div>
    <div style="margin-top:16px"><button class="btn btn-primary">出力</button></div>
  </div>
  <div class="card">
    <p class="section-title">結果メッセージ(表示例)</p>
    <div class="result-ok" style="margin-bottom:8px">対象期間にデータがありませんでした(項目名のみ出力しました)</div>
    <div class="err-box" style="margin:0">出力に失敗しました <span class="muted">※失敗時のみ表示</span></div>
  </div>
</div>
</body>
</html>
