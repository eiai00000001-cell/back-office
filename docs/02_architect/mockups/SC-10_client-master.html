<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SC-10 取引先マスタ管理 - EIAI TEC 事務管理システム</title>
<style>
:root{
  --color-bg:#f4f6f8;--color-surface:#ffffff;--color-border:#dde1e6;--color-text:#222831;
  --color-text-sub:#6b7280;--color-primary:#2c5f7c;--color-primary-dark:#1f4a61;--radius:6px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--color-bg);color:var(--color-text);font-size:14px;line-height:1.6;}
.app-header{background:var(--color-primary);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
.app-header .title{font-size:18px;font-weight:600;}
.app-header .back-link{color:#e6eef2;text-decoration:none;font-size:13px;}
.app-header .back-link:hover{text-decoration:underline;}
.container{max-width:1100px;margin:0 auto;padding:24px;}
h1.page-title{font-size:20px;margin:0 0 16px;}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
.section-title{font-size:15px;font-weight:600;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--color-border);}
.toolbar{display:flex;justify-content:flex-end;margin-bottom:14px;}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px 12px;border-bottom:1px solid var(--color-border);text-align:left;font-size:13px;}
th{background:#eef1f4;color:var(--color-text-sub);font-weight:600;white-space:nowrap;}
.btn{display:inline-block;padding:8px 16px;border-radius:4px;border:1px solid var(--color-border);background:#fff;color:var(--color-text);font-size:13px;cursor:pointer;text-decoration:none;}
.btn-small{padding:4px 12px;font-size:12px;}
.btn-primary{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}
.btn-primary:hover{background:var(--color-primary-dark);}
.form-grid{display:grid;grid-template-columns:140px 1fr 140px 1fr;gap:12px 16px;align-items:center;}
.form-grid label{font-size:13px;color:var(--color-text-sub);}
input[type=text]{padding:7px 10px;border:1px solid var(--color-border);border-radius:4px;font-size:13px;width:100%;font-family:inherit;}
.actions-bar{display:flex;justify-content:flex-end;margin-top:16px;}
.hint{font-size:12px;color:var(--color-text-sub);margin-top:16px;}
</style>
</head>
<body>
<header class="app-header">
  <div class="title">EIAI TEC 事務管理システム</div>
  <a href="./SC-01_home.html" class="back-link">← ホームへ</a>
</header>
<div class="container">
  <h1 class="page-title">取引先マスタ管理</h1>

  <div class="card">
    <div class="section-title">取引先一覧</div>
    <div class="toolbar">
      <button class="btn btn-primary">新規登録</button>
    </div>
    <table>
      <thead>
        <tr><th>名称</th><th>住所</th><th>担当者名</th><th>連絡先</th><th></th></tr>
      </thead>
      <tbody>
        <tr>
          <td>株式会社サンプル商事</td>
          <td>東京都千代田区サンプル町1-1-1</td>
          <td>鈴木 太郎</td>
          <td>03-1234-5678</td>
          <td><button class="btn btn-small">編集</button></td>
        </tr>
        <tr>
          <td>山田デザイン事務所</td>
          <td>大阪府大阪市サンプル区2-2-2</td>
          <td>山田 花子</td>
          <td>06-2345-6789</td>
          <td><button class="btn btn-small">編集</button></td>
        </tr>
        <tr>
          <td>合同会社テストワークス</td>
          <td>愛知県名古屋市サンプル区3-3-3</td>
          <td>佐藤 次郎</td>
          <td>052-345-6789</td>
          <td><button class="btn btn-small">編集</button></td>
        </tr>
      </tbody>
    </table>
    <p class="hint">請求書・見積書の編集画面から「新規登録」を選択した場合も、下記フォームに入力・保存後、呼び出し元の画面へ戻り選択状態になります。</p>
  </div>

  <div class="card">
    <div class="section-title">取引先登録・編集</div>
    <div class="form-grid">
      <label>名称 <span style="color:#c0392b;">*</span></label>
      <input type="text" placeholder="株式会社サンプル商事">
      <label>郵便番号</label>
      <input type="text" placeholder="100-0001">

      <label>住所</label>
      <input type="text" placeholder="東京都千代田区サンプル町1-1-1" style="grid-column: 2 / 5;">

      <label>担当者名</label>
      <input type="text" placeholder="鈴木 太郎">
      <label>連絡先</label>
      <input type="text" placeholder="03-1234-5678">
    </div>
    <div class="actions-bar">
      <button class="btn btn-primary">保存</button>
    </div>
  </div>
</div>
</body>
</html>
