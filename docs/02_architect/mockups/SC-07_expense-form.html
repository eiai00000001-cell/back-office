<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SC-07 経費登録・編集 - EIAI TEC 事務管理システム</title>
<style>
:root{
  --color-bg:#f4f6f8;--color-surface:#ffffff;--color-border:#dde1e6;--color-text:#222831;
  --color-text-sub:#6b7280;--color-primary:#2c5f7c;--color-primary-dark:#1f4a61;--radius:6px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--color-bg);color:var(--color-text);font-size:14px;line-height:1.6;}
.app-header{background:var(--color-primary);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
.app-header .title{font-size:18px;font-weight:600;}
.app-header .back-link{color:#e6eef2;text-decoration:none;font-size:13px;}
.app-header .back-link:hover{text-decoration:underline;}
.container{max-width:760px;margin:0 auto;padding:24px;}
h1.page-title{font-size:20px;margin:0 0 16px;}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:24px;margin-bottom:20px;}
.form-grid{display:grid;grid-template-columns:140px 1fr;gap:14px 16px;align-items:start;}
.form-grid label{font-size:13px;color:var(--color-text-sub);padding-top:8px;}
input[type=text],input[type=date],input[type=number],select,textarea{
  padding:7px 10px;border:1px solid var(--color-border);border-radius:4px;font-size:13px;width:100%;font-family:inherit;
}
textarea{resize:vertical;min-height:70px;}
.hint{font-size:12px;color:var(--color-text-sub);margin-top:4px;}
.file-drop{border:2px dashed var(--color-border);border-radius:6px;padding:24px;text-align:center;color:var(--color-text-sub);font-size:13px;}
.file-drop .btn{margin-top:10px;}
.btn{display:inline-block;padding:8px 16px;border-radius:4px;border:1px solid var(--color-border);background:#fff;color:var(--color-text);font-size:13px;cursor:pointer;text-decoration:none;}
.btn-primary{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}
.btn-primary:hover{background:var(--color-primary-dark);}
.actions-bar{display:flex;justify-content:flex-end;}
.other-input{margin-top:8px;}
</style>
</head>
<body>
<header class="app-header">
  <div class="title">EIAI TEC 事務管理システム</div>
  <a href="./SC-06_expense-list.html" class="back-link">← 経費一覧へ</a>
</header>
<div class="container">
  <h1 class="page-title">経費登録・編集</h1>
  <div class="card">
    <div class="form-grid">
      <label>発生日 <span style="color:#c0392b;">*</span></label>
      <input type="date" value="2026-09-12">

      <label>勘定科目 <span style="color:#c0392b;">*</span></label>
      <div>
        <select>
          <option>旅費交通費</option>
          <option>通信費</option>
          <option selected>消耗品費</option>
          <option>水道光熱費</option>
          <option>地代家賃</option>
          <option>外注工賃</option>
          <option>接待交際費</option>
          <option>会議費</option>
          <option>新聞図書費</option>
          <option>支払手数料</option>
          <option>租税公課</option>
          <option>雑費</option>
          <option>その他</option>
        </select>
        <!-- 「その他」選択時のみ以下の自由入力欄を表示する -->
        <input type="text" class="other-input" placeholder="その他の場合、科目名を入力" style="display:none;">
      </div>

      <label>金額 <span style="color:#c0392b;">*</span></label>
      <input type="number" value="3300" placeholder="0">

      <label>税区分 <span style="color:#c0392b;">*</span></label>
      <select>
        <option selected>標準10%</option>
        <option>非課税</option>
        <option>不課税</option>
        <option>対象外</option>
      </select>

      <label>支払先</label>
      <input type="text" value="サンプル文具店">

      <label>支払方法</label>
      <select>
        <option>現金</option>
        <option selected>クレジットカード</option>
        <option>銀行振込</option>
        <option>その他</option>
      </select>

      <label>メモ</label>
      <textarea placeholder="任意でメモを入力"></textarea>

      <label>領収書ファイル</label>
      <div>
        <div class="file-drop">
          ここにファイルをドラッグ&ドロップ、または<br>
          <button class="btn">ファイルを選択</button>
          <div class="hint">対応形式: jpg / jpeg / png / pdf(最大10MB)</div>
        </div>
      </div>
    </div>
  </div>

  <div class="actions-bar">
    <button class="btn btn-primary">保存</button>
  </div>
</div>
</body>
</html>
