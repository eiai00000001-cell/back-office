<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SC-11 システム設定(発行者情報) - EIAI TEC 事務管理システム</title>
<style>
:root{
  --color-bg:#f4f6f8;--color-surface:#ffffff;--color-border:#dde1e6;--color-text:#222831;
  --color-text-sub:#6b7280;--color-primary:#2c5f7c;--color-primary-dark:#1f4a61;--radius:6px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--color-bg);color:var(--color-text);font-size:14px;line-height:1.6;}
.app-header{background:var(--color-primary);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
.app-header .title{font-size:18px;font-weight:600;}
.app-header .back-link{color:#e6eef2;text-decoration:none;font-size:13px;}
.app-header .back-link:hover{text-decoration:underline;}
.container{max-width:700px;margin:0 auto;padding:24px;}
h1.page-title{font-size:20px;margin:0 0 4px;}
.sub-title{font-size:13px;color:var(--color-text-sub);margin-bottom:16px;}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:24px;}
.form-grid{display:grid;grid-template-columns:140px 1fr;gap:14px 16px;align-items:start;}
.form-grid label{font-size:13px;color:var(--color-text-sub);padding-top:8px;}
input[type=text]{padding:7px 10px;border:1px solid var(--color-border);border-radius:4px;font-size:13px;width:100%;font-family:inherit;}
.hint{font-size:12px;color:var(--color-text-sub);margin-top:4px;}
.actions-bar{display:flex;justify-content:flex-end;margin-top:20px;}
.btn{display:inline-block;padding:8px 16px;border-radius:4px;border:1px solid var(--color-border);background:#fff;color:var(--color-text);font-size:13px;cursor:pointer;text-decoration:none;}
.btn-primary{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}
.btn-primary:hover{background:var(--color-primary-dark);}
</style>
</head>
<body>
<header class="app-header">
  <div class="title">事務管理システム</div>
  <a href="./SC-01_home.html" class="back-link">← ホームへ</a>
</header>
<div class="container">
  <h1 class="page-title">システム設定(発行者情報)</h1>
  <div class="sub-title">請求書・見積書のPDF出力時に、ここで登録した内容が表示されます。</div>
  <div class="card">
    <div class="form-grid">
      <label>氏名 <span style="color:#c0392b;">*</span></label>
      <input type="text" value="山田 太郎">

      <label>屋号</label>
      <input type="text" value="EIAI TEC">

      <label>住所</label>
      <input type="text" value="東京都千代田区サンプル町1-1-1">

      <label>連絡先</label>
      <input type="text" value="info@example.com / 03-1234-5678">

      <label>登録番号</label>
      <div>
        <input type="text" placeholder="T1234567890123">
        <div class="hint">記載は任意です。適格請求書発行事業者の登録番号をお持ちの場合のみご入力ください。</div>
      </div>
    </div>
    <div class="actions-bar">
      <button class="btn btn-primary">保存</button>
    </div>
  </div>
</div>
</body>
</html>
