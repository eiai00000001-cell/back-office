<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>SC-06 経費一覧・検索 - EIAI TEC 事務管理システム</title>
<style>
:root{
  --color-bg:#f4f6f8;--color-surface:#ffffff;--color-border:#dde1e6;--color-text:#222831;
  --color-text-sub:#6b7280;--color-primary:#2c5f7c;--color-primary-dark:#1f4a61;--radius:6px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;background:var(--color-bg);color:var(--color-text);font-size:14px;line-height:1.6;}
.app-header{background:var(--color-primary);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;}
.app-header .title{font-size:18px;font-weight:600;}
.app-header .back-link{color:#e6eef2;text-decoration:none;font-size:13px;}
.app-header .back-link:hover{text-decoration:underline;}
.container{max-width:1200px;margin:0 auto;padding:24px;}
h1.page-title{font-size:20px;margin:0 0 16px;}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:20px;}
.toolbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:12px;}
.filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
.filter-bar .field{display:flex;flex-direction:column;gap:4px;}
.filter-bar label{font-size:12px;color:var(--color-text-sub);}
select,input[type=date]{padding:7px 10px;border:1px solid var(--color-border);border-radius:4px;font-size:13px;font-family:inherit;background:#fff;}
select{min-width:150px;}
.actions-right{display:flex;gap:8px;}
.btn{display:inline-block;padding:8px 16px;border-radius:4px;border:1px solid var(--color-border);background:#fff;color:var(--color-text);font-size:13px;cursor:pointer;text-decoration:none;}
.btn-primary{background:var(--color-primary);border-color:var(--color-primary);color:#fff;}
.btn-primary:hover{background:var(--color-primary-dark);}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px 12px;border-bottom:1px solid var(--color-border);text-align:left;font-size:13px;}
th{background:#eef1f4;color:var(--color-text-sub);font-weight:600;white-space:nowrap;}
td.amount{text-align:right;}
tr.row-link{cursor:pointer;}
tr.row-link:hover{background:#f7f9fa;}
.icon-attach{color:var(--color-primary);font-weight:600;font-size:12px;border:1px solid var(--color-primary);border-radius:3px;padding:2px 6px;cursor:pointer;}
.icon-none{color:#c9ced3;font-size:12px;}
</style>
</head>
<body>
<header class="app-header">
  <div class="title">EIAI TEC 事務管理システム</div>
  <a href="./SC-01_home.html" class="back-link">← ホームへ</a>
</header>
<div class="container">
  <h1 class="page-title">経費一覧・検索</h1>
  <div class="card">
    <div class="toolbar">
      <div class="filter-bar">
        <div class="field">
          <label>勘定科目</label>
          <select>
            <option>すべて</option>
            <option>旅費交通費</option>
            <option>通信費</option>
            <option>消耗品費</option>
            <option>水道光熱費</option>
            <option>地代家賃</option>
            <option>外注工賃</option>
            <option>接待交際費</option>
            <option>会議費</option>
            <option>新聞図書費</option>
            <option>支払手数料</option>
            <option>租税公課</option>
            <option>雑費</option>
            <option>その他</option>
          </select>
        </div>
        <div class="field">
          <label>支払方法</label>
          <select>
            <option>すべて</option>
            <option>現金</option>
            <option>クレジットカード</option>
            <option>銀行振込</option>
            <option>その他</option>
          </select>
        </div>
        <div class="field">
          <label>期間(From)</label>
          <input type="date">
        </div>
        <div class="field">
          <label>期間(To)</label>
          <input type="date">
        </div>
      </div>
      <div class="actions-right">
        <a href="./SC-08_expense-summary.html" class="btn">集計を見る</a>
        <a href="./SC-07_expense-form.html" class="btn btn-primary">新規登録</a>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>発生日</th>
          <th>勘定科目</th>
          <th style="text-align:right;">金額</th>
          <th>税区分</th>
          <th>支払先</th>
          <th>支払方法</th>
          <th>領収書</th>
        </tr>
      </thead>
      <tbody>
        <tr class="row-link" onclick="location.href='./SC-07_expense-form.html'">
          <td>2026-09-12</td>
          <td>消耗品費</td>
          <td class="amount">3,300円</td>
          <td>標準10%</td>
          <td>サンプル文具店</td>
          <td>クレジットカード</td>
          <td><span class="icon-attach" onclick="event.stopPropagation();">表示</span></td>
        </tr>
        <tr class="row-link" onclick="location.href='./SC-07_expense-form.html'">
          <td>2026-09-08</td>
          <td>旅費交通費</td>
          <td class="amount">1,200円</td>
          <td>非課税</td>
          <td>サンプル鉄道</td>
          <td>現金</td>
          <td><span class="icon-none">なし</span></td>
        </tr>
        <tr class="row-link" onclick="location.href='./SC-07_expense-form.html'">
          <td>2026-09-01</td>
          <td>通信費</td>
          <td class="amount">6,600円</td>
          <td>標準10%</td>
          <td>サンプル通信株式会社</td>
          <td>銀行振込</td>
          <td><span class="icon-attach" onclick="event.stopPropagation();">表示</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
